name: IELTS release setup
on:
  push:
    branches: [ielts-release-setup-20261114]
    paths:
      - .github/workflows/ielts-release-setup.yml
      - ci/ielts-setup/**
permissions:
  contents: read
jobs:
  setup:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install the public-key encryption library
        run: python3 -m pip install --disable-pip-version-check --quiet PyNaCl==1.6.0
      - name: Seal existing release settings for the IELTS repository
        run: python3 ci/ielts-setup/encrypt-secrets.py
        env:
          REPO_PUBLIC_KEY: "FJdb7rAfbbrr/jmpNX29PeOxpAe45tstFuFInOnCXT4="
          REPO_KEY_ID: "3380204578043523366"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          MATCH_PASSWORD_NEXT: ${{ secrets.MATCH_PASSWORD_NEXT }}
          SIGNING_CERTIFICATE_ID: ${{ secrets.SIGNING_CERTIFICATE_ID }}
          SIGNING_DEPLOY_KEY: ${{ secrets.SIGNING_DEPLOY_KEY }}
          SIGNING_STORE_URL: ${{ secrets.SIGNING_STORE_URL }}
      - name: Check the Apple account and register only the IELTS App ID if absent
        run: node ci/ielts-setup/apple-preflight.mjs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SIGNING_CERTIFICATE_ID: ${{ secrets.SIGNING_CERTIFICATE_ID }}
      - name: Save the report and GitHub-sealed envelopes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ielts-release-setup
          path: ielts-setup-output/
          retention-days: 1
          if-no-files-found: error
